<div class="modal-backdrop" *ngIf="isVisible" (click)="onBackdropClick($event)">
  <div class="modal-content" role="dialog" aria-modal="true" aria-label="QR code do portfólio" (click)="$event.stopPropagation()">
    <img src="assets/qrcode.png" alt="QR code que aponta para este portfólio" width="300" height="300">
  </div>
</div>
