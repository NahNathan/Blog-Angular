<nav class="container__menu-bar" [attr.aria-label]="language === 'pt' ? 'Contatos e opções' : 'Contacts and options'">
    <ul>
        <li><a target="_blank" rel="noopener noreferrer" href="https://www.linkedin.com/in/nathan-rodrigues-dos-santos-422001147/" [attr.aria-label]="language === 'pt' ? 'Perfil no LinkedIn (abre em nova aba)' : 'LinkedIn profile (opens in a new tab)'"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a></li>
        <li><a target="_blank" rel="noopener noreferrer" href="https://github.com/NahNathan" [attr.aria-label]="language === 'pt' ? 'Perfil no GitHub (abre em nova aba)' : 'GitHub profile (opens in a new tab)'"><i class="fa-brands fa-github" aria-hidden="true"></i></a></li>
        <li><a href="#" (click)="downloadCV($event)" [attr.aria-label]="language === 'pt' ? 'Baixar currículo em PDF' : 'Download resume as PDF'"><i class="fas fa-file-alt" aria-hidden="true"></i></a></li>
        <li>
            <a href="#" (click)="copyEmailToClipboard($event)" [attr.aria-label]="language === 'pt' ? 'Copiar meu email' : 'Copy my email'">
                <i class="fa fa-envelope" aria-hidden="true"></i>
            </a>
            <span class="mailto-message" role="status" *ngIf="showMessage">{{ language === 'pt' ? 'Email copiado para a área de transferência.' : 'Email copied to clipboard.' }}</span>
        </li>
        <li><a href="#" (click)="showQRCode($event)" [attr.aria-label]="language === 'pt' ? 'Mostrar QR code do portfólio' : 'Show portfolio QR code'"><i class="fa-solid fa-qrcode" aria-hidden="true"></i></a></li>

        <li *ngIf="language=='pt'"><a href="#" (click)="changeToEnglish($event)" aria-label="Switch to English" lang="en">🇬🇧</a></li>
        <li *ngIf="language=='en'"><a href="#" (click)="changeToPortuguese($event)" aria-label="Mudar para português" lang="pt-BR">🇧🇷</a></li>
    </ul>
</nav>
<app-qr-modal [isVisible]="showQRCodeModal" (closeModal)="closeQRCodeModal()"></app-qr-modal>
