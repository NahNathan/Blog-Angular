<div class="techs-slider">
  <button type="button" class="nav-btn left" (click)="prevSlide()" [attr.aria-label]="language === 'pt' ? 'Tecnologia anterior' : 'Previous technology'"><span aria-hidden="true">&#10094;</span></button>

  <div class="tech-content">
    <h2 *ngIf="language === 'pt'">Tecnologias que tenho experiência</h2>
    <h2 *ngIf="language === 'en'">Technologies I have experience with</h2>
    <div [ngClass]="animationClass">
      <h3>{{ techs[currentIndex].title }}</h3>
      <img [src]="techs[currentIndex].image" alt="{{ techs[currentIndex].title }}">
      <p>{{ techs[currentIndex].description }}</p>
    </div>
  </div>
  <button type="button" class="nav-btn right" (click)="nextSlide()" [attr.aria-label]="language === 'pt' ? 'Próxima tecnologia' : 'Next technology'"><span aria-hidden="true">&#10095;</span></button>
</div>

<hr>
